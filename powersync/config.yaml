
replication:
  connections:
    - type: postgresql
      hostname: postgres
      port: 5432
      database: linear_clone
      username: powersync_replicator
      password: !env PS_REPLICATION_PASSWORD
      sslmode: disable

storage:
  type: postgresql
  hostname: postgres
  port: 5432
  database: powersync_storage
  username: powersync_storage
  password: !env PS_STORAGE_PASSWORD
  sslmode: disable

port: 8080
sync_config:
  path: /config/sync.yaml

client_auth:
  jwks_uri: http://host.docker.internal:3000/api/auth/jwks
  audience: [powersync]
  # No documented issuer option. Better Auth must issue JWTs with
  # iss=BETTER_AUTH_URL (http://localhost:3000), sub=user.id, aud=powersync.
  # Include kid, iat and exp; use short-lived asymmetric JWTs.

healthcheck:
  probes:
    use_http: true

telemetry:
  disable_telemetry_sharing: true
